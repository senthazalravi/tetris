name = "lop-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "lop-db"
database_id = "local-lop-db"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "lop-attachments"

[[durable_objects.bindings]]
name = "USER_GATEWAY"
class_name = "UserGateway"

[[migrations]]
tag = "v1"
new_classes = ["UserGateway"]

[vars]
APP_ORIGIN = "http://localhost:5173"
COOKIE_SECURE = "false"

[triggers]
crons = ["0 * * * *"]

[dev]
port = 8787
